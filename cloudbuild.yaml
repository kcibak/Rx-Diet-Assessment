# Builds the production Docker image, pushes it to Artifact Registry, and deploys Cloud Run.
# Substitutions define the service, region, repository, and image used by the deployment.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - rxdiet-project/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}
      - rxdiet-project

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}
      - --region
      - ${_REGION}
      - --allow-unauthenticated
      - --set-secrets
      - DATABASE_URL=rxdiet-database-url:latest
      - --set-env-vars
      - NODE_ENV=production,SESSION_DURATION_DAYS=7

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE_NAME: rxdiet-assess
  _REGION: us-central1
  _REPOSITORY: rxdiet-repo
  _IMAGE: rxdiet-image
