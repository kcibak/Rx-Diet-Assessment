name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rxdiet-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rxdiet-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm run security:audit

