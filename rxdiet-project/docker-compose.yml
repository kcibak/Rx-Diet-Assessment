# Runs the production container locally using the Dockerfile and variables from .env.
# This is intended for app smoke testing and does not provision a database.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rxdiet_app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
